services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rusmedia
      POSTGRES_PASSWORD: rusmedia
      POSTGRES_DB: rusmedia
    ports: ["5432:5432"]
    volumes: [".docker-data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rusmedia"]
      interval: 5s
      retries: 10

  # File storage (S3-compatible). Official minio/minio images were removed from Docker Hub in 2026,
  # so this uses "Silo", a drop-in community fork of MinIO with the same command and settings.
  # The server creates the buckets itself on startup, so no init container is needed.
  minio:
    image: docker.io/pgsty/silo:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rusmedia
      MINIO_ROOT_PASSWORD: rusmedia-secret-change-me
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000"
    ports: ["9000:9000", "9001:9001"]
    volumes: [".docker-data/minio:/data"]
